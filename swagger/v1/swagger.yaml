---
openapi: 3.0.1
info:
  title: Prueba Rails Jenkins API
  version: v1
  description: API de ejemplo con autenticación JWT. Obtén un token en /auth/register
    o /auth/login y úsalo con el botón Authorize.
paths:
  "/auth/register":
    post:
      summary: Registra un usuario y devuelve un JWT
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: usuario creado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/session"
        '422':
          description: parámetros inválidos
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                      minLength: 8
                    password_confirmation:
                      type: string
                  required:
                  - email
                  - password
              required:
              - user
  "/auth/login":
    post:
      summary: Inicia sesión y devuelve un JWT
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: credenciales válidas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/session"
        '401':
          description: credenciales inválidas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
              - email
              - password
  "/auth/me":
    get:
      summary: Devuelve el usuario autenticado
      tags:
      - Auth
      security:
      - bearerAuth: []
      responses:
        '200':
          description: token válido
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    "$ref": "#/components/schemas/user"
                required:
                - user
        '401':
          description: token ausente, inválido o expirado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
      required:
      - errors
    user:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
      required:
      - id
      - email
    session:
      type: object
      properties:
        token:
          type: string
          description: JWT firmado (HS256), expira en 24 horas
        user:
          "$ref": "#/components/schemas/user"
      required:
      - token
      - user
servers:
- url: "/"
  description: Este servidor
